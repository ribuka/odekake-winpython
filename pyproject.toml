[project]
name = "odekake-winpython"
# Not used. The release version is in the VERSION file (this tool is not installed as a package).
version = "0"
description = "Packs a uv project into a ZIP bundled with WinPython, for use on offline Windows machines."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
